---

env: local
log: /var/log/wfsync.log
location: UTC
file_path: /local/file/path
listen:
  bind_ip: 0.0.0.0
  port: 8080
stripe:
  test_mode: true
  api_key: your-stripe-api-key
  test_key: your-test-api-key
  webhook_secret: your-stripe-webhook-secret
  webhook_test_secret: your-stripe-webhook-test-secret
wfirma:
  enabled: false
  access_key: your-wfirma-access-key
  secret_key: your-wfirma-secret-key
  app_id: your-wfirma-app-id
  # On KSeF auth rejection, save the invoice as a draft (wersja robocza) instead of failing.
  # Draft is not sent to KSeF and must be accepted manually in wFirma. See docs/wfirma-ksef-draft-fallback.md.
  ksef_draft_fallback: false
mongo:
  enabled: false
  host: 127.0.0.1
  port: 27017
  user: admin
  password: pass
  database: evsys
  save_url: mongodb://admin:pass@
opencart:
  enabled: false
  driver: mysql
  hostname: localhost
  username: user
  password: pass
  database: oc
  port: 3306
  prefix: oc_
  file_url: file-url
  status_url_request: 0
  status_url_result: 0
  status_proforma_request: 0
  status_proforma_result: 0
  # OpenCart status set when a bank transfer settles an order in full.
  # Instance-specific; 0 leaves order statuses untouched.
  status_bank_paid: 0
telegram:
  enabled: true
  api_key: your-telegram-api-key
vies:
  enabled: false
  cache_hours: 720
  attempts: 3
  retry_delay_ms: 1000
enable_banking:
  enabled: false
  base_url: https://api.enablebanking.com
  app_id: your-enable-banking-app-id
  private_key_path: /path/to/enablebanking/private.pem
  redirect_url: http://localhost:8080/bank/callback
  # Sandbox has no PKO connector: use Mock ASPSP or Bank Millennium for local work.
  aspsp_name: Mock ASPSP
  aspsp_country: PL
  psu_type: business
  ibans: []
  poll_interval_min: 30
  lookback_days: 7
  reauth_warn_days: 30
  request_timeout_sec: 30
