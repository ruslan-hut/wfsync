---
env: dev
log: /var/log/wfsync.log
location: Europe/Warsaw
file_path: ${FILE_PATH}
listen:
  bind_ip: 127.0.0.1
  port: 9090
stripe:
  test_mode: false
  api_key: ${STRIPE_API_KEY}
  test_key: ${STRIPE_TEST_KEY}
  webhook_secret: ${STRIPE_WH_SECRET}
  webhook_test_secret: ${STRIPE_TEST_WH_SECRET}
  success_url: ${STRIPE_SUCCESS_URL}
wfirma:
  enabled: true
  access_key: ${WF_ACCESS_KEY}
  secret_key: ${WF_SECRET_KEY}
  app_id: ${WF_APP_ID}
  # On KSeF auth rejection, save the invoice as a draft (wersja robocza) instead of failing.
  # Draft is not sent to KSeF and must be accepted manually in wFirma. See docs/wfirma-ksef-draft-fallback.md.
  ksef_draft_fallback: true
retry_queue:
  enabled: true
  interval_min: 5
  max_retries: 10
  base_delay_sec: 600
  max_order_age_days: 60
payment_reconciler:
  enabled: true
  interval_min: 15
vatrates:
  enabled: true
  refresh_hours: 24
  trust_db: true
vies:
  enabled: true
  cache_hours: 720
  attempts: 3
  retry_delay_ms: 1000
mongo:
  enabled: true
  host: ${MONGO_HOST}
  port: ${MONGO_PORT}
  user: ${MONGO_USER}
  password: ${MONGO_PASSWORD}
  database: ${MONGO_DATABASE}
opencart:
  enabled: true
  driver: mysql
  hostname: localhost
  username: ${SQL_USERNAME}
  password: ${SQL_PASSWORD}
  database: ${SQL_DATABASE}
  port: 3306
  prefix: oc_
  file_url: ${FILE_URL}
  status_url_request: 22
  status_url_result: 23
  status_invoice_request: 26
  status_invoice_result: 27
  status_proforma_request: 24
  status_proforma_result: 25
  custom_field_nip: 2
  # OpenCart status set when a bank transfer settles an order in full.
  # Instance-specific; 0 leaves order statuses untouched.
  status_bank_paid: 0
telegram:
  enabled: true
  api_key: ${TELEGRAM_API_KEY}
enable_banking:
  # Enabled, but reaching real PKO accounts additionally requires a production
  # application, which Enable Banking issues only once the agreement is signed. Until
  # then a sandbox application authorizes against sandbox connectors only.
  enabled: true
  base_url: https://api.enablebanking.com
  app_id: ${EB_APP_ID}
  # PEM-encoded RSA private key, mode 0600, owned by the service user. Never in git.
  private_key_path: /etc/conf/enablebanking.pem
  # Must match a redirect URL registered for the application.
  redirect_url: https://api.darkbyrior.com/bank/callback
  aspsp_name: PKO
  aspsp_country: PL
  psu_type: business
  # Empty means poll every account the consent covers.
  ibans: []
  # PSD2 allows as few as 4 requests per account per day without the account holder
  # present. Until PKO's actual limit is confirmed, a shorter interval may simply be
  # refused by the bank.
  poll_interval_min: 30
  lookback_days: 7
  reauth_warn_days: 30
  request_timeout_sec: 30
