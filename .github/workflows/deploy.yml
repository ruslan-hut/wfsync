name: Deploy to server

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare configuration file
        run: |
          # Substitute every ${VAR} placeholder found in the template. Values come from
          # the env block below; a placeholder without a value fails the deploy here
          # rather than reaching the server empty, which the service cannot detect.
          if ! command -v envsubst >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq gettext-base
          fi

          missing=""
          for var in $(grep -o '${[A-Z0-9_]\+}' wfsync.yml | tr -d '${}' | sort -u); do
            if [ -z "${!var:-}" ]; then
              missing="$missing $var"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::No value for placeholders in wfsync.yml:$missing (add the secret and map it in the env block)"
            exit 1
          fi

          envsubst < wfsync.yml > wfsync.yml.rendered && mv wfsync.yml.rendered wfsync.yml
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_TEST_KEY: ${{ secrets.STRIPE_TEST_KEY }}
          STRIPE_WH_SECRET: ${{ secrets.STRIPE_WH_SECRET }}
          STRIPE_TEST_WH_SECRET: ${{ secrets.STRIPE_TEST_WH_SECRET }}
          STRIPE_SUCCESS_URL: ${{ secrets.STRIPE_SUCCESS_URL }}
          WF_ACCESS_KEY: ${{ secrets.WF_ACCESS_KEY }}
          WF_SECRET_KEY: ${{ secrets.WF_SECRET_KEY }}
          WF_APP_ID: ${{ secrets.WF_APP_ID }}
          MONGO_HOST: ${{ secrets.MONGO_HOST }}
          MONGO_PORT: ${{ secrets.MONGO_PORT }}
          MONGO_USER: ${{ secrets.MONGO_USER }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          MONGO_DATABASE: ${{ secrets.MONGO_DATABASE }}
          SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          SQL_DATABASE: ${{ secrets.SQL_DATABASE }}
          FILE_PATH: ${{ secrets.FILE_PATH }}
          FILE_URL: ${{ secrets.FILE_URL }}
          TELEGRAM_API_KEY: ${{ secrets.TELEGRAM_API_KEY }}
          EB_APP_ID: ${{ secrets.EB_APP_ID }}

      - name: Copy Configuration to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "wfsync.yml"
          target: "/etc/conf"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go application
        run: |
          go build -v -o wfsync ./cmd/server

      - name: Deploy to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "wfsync"
          target: "/usr/local/bin/"

      - name: Restart Application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            systemctl restart wfsync.service 
